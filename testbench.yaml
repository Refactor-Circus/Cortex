laravel: '@testbench'

providers:
  - JayI\Atrium\AtriumServiceProvider
  - JayI\Cortex\CortexServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations
  - database/migrations
  # jayi/pennantplus (dev dependency, auto-discovered) decides CortexSupportFeature
  # through Pennant, whose features table lives here.
  - vendor/laravel/pennant/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/atrium'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
    - atrium-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
