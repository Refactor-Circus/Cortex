name: ui

# Cortex's Atrium front-end module (atrium/, built to dist/atrium): a frozen
# pnpm install, typecheck, Vitest and a build that must reproduce the
# committed dist/atrium byte for byte. The PHP suite (tests.yml) stays
# Node-free and checks the build's source hash instead.

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest

    name: Front end

    defaults:
      run:
        working-directory: atrium

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: atrium/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: atrium/.nvmrc
          cache: pnpm
          cache-dependency-path: atrium/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Committed build matches a fresh build
        run: |
          git diff --exit-code -- ../dist/atrium
          test -z "$(git status --porcelain -- ../dist/atrium)"
