name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      # Regenerates the autoloader so vendor/composer/autoload_files.php lists the
      # src/Domains/ConcreteServer/shims.php compatibility shim before any test runs.
      - name: Dump autoloader
        run: composer dump-autoload

      - name: PHPStan
        if: runner.os != 'Windows'
        run: composer analyse

      - name: PHPStan (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/phpstan analyse --configuration=phpstan.windows.neon --no-progress

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest

  # The authoritative no-Atrium proof: Atrium is uninstalled, so no classmap or
  # Composer `files` entry can reach it, as the in-process suite cannot see.
  without-atrium:
    runs-on: ubuntu-latest

    name: P8.5 - L13.* - without Atrium

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      # testbench.yaml loads Atrium's provider for the workbench; Testbench's
      # package:discover (run by Composer's scripts) dies on it once Atrium is gone.
      - name: Drop Atrium from the Testbench providers
        run: sed -i '/RefactorCircus\\Atrium\\AtriumServiceProvider/d' testbench.yaml

      - name: Remove Atrium
        run: composer remove --dev refactor-circus/atrium --no-update --no-interaction

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Dump autoloader
        run: composer dump-autoload

      - name: Atrium is not installed
        run: test ! -e vendor/refactor-circus/atrium

      - name: Test Suite without Atrium
        run: composer test:without-atrium
