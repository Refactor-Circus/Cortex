# Agent OS Standards Index

backend:
  domain-modules:
    description: "src/Domains/{Domain} layout, domain providers, *Model naming, morph aliases for moved models"
  action-transactions:
    description: DB::transaction on every write; return models with relations eager-loaded
  actions:
    description: "Action class shape: static rules(), execute(), shared by HTTP and MCP surfaces"
  config-docs:
    description: Config sections carry banner comments with security warnings and modes
  container-bindings:
    description: "Binding lifetimes: scoped for DB-memoizing services, singleton for code state"
  domain-guards:
    description: Business-rule failures throw field-keyed ValidationException
  feature-toggles:
    description: Optional surfaces gated by strict enabled === true config checks
  http-requests:
    description: Thin controllers; FormRequests own validation, action call, and response via persist()
  http-resources:
    description: "Resource serialization: slug identity, whenLoaded relations, ISO8601 timestamps"
  mcp-model-binding:
    description: Per-model abstract McpRequest bases resolve slug to model
  mcp-responses:
    description: Structured responses use data envelope and shared HTTP Resources
  mcp-schemas:
    description: Schema field descriptions, shared payload traits, versioned tool descriptions
  mcp-tools:
    description: Declarative tool shells; logic in McpRequest classes mirroring FormRequests
  prompt-resolution:
    description: "Instruction order: pinned wins, published via cache, unpublished throws"
  publication-cache:
    description: Cache published content only; publish actions must invalidate
  publish-tags:
    description: Umbrella cortex tag plus cortex-* group tags behind console guard
  routes:
    description: Config-driven route group, slug binding, named routes, POST verb suffixes
  runtime-exceptions:
    description: Typed RuntimeExceptions with forX() constructors for execution failures
  slug-references:
    description: Inputs use slugs and version numbers; FKs resolved inside actions
  sub-agents:
    description: Recursive sub-agent tools with dual cycle guards

frontend:
  atrium-screens:
    description: "Views use only x-atrium components and safelisted utilities; audit-trail for history"

database:
  immutable-versions:
    description: Version rows never edited; model hook throws, new row per version
  migrations:
    description: Fixed-date sequenced migrations, ULID PKs, one file per feature
  models:
    description: final models with HasUlids, cortex_ tables, property docblocks, factories
  publish-pointer:
    description: FK-free published_version_id pointer; integrity at publish + cache invalidation

testing:
  arch-tests:
    description: "Executable global constraints: strict types, banned functions, Pest presets"
  mcp-http-parity:
    description: MCP tool responses must match canonical HTTP payloads
  test-layers:
    description: Behavior tested at actions; HTTP/MCP tests cover surface wiring only
  testcase-environment:
    description: "Pinned Testbench env: array cache, FK constraints, provider order"
